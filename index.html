<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Attempts</title>
  
  <!-- iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Attempts">
  <meta name="theme-color" content="#0d1117">
  
  <!-- Dynamic Web App Manifest Generation -->
  <script>
    const manifest = {
      "name": "Attempts - Luck Quota Tracker",
      "short_name": "Attempts",
      "start_url": "./",
      "display": "standalone",
      "background_color": "#0d1117",
      "theme_color": "#0d1117",
      "icons": [
        {
          "src": "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230d1117'/><text y='.9em' font-size='90'>🎯</text></svg>",
          "sizes": "512x512",
          "type": "image/svg+xml"
        }
      ]
    };
    const stringManifest = JSON.stringify(manifest);
    const blob = new Blob([stringManifest], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(blob);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = manifestURL;
    document.head.appendChild(link);
  </script>

  <style>
    :root {
      --bg: #f6f8fa;
      --card-bg: #ffffff;
      --text: #1f2328;
      --text-muted: #636c76;
      --border: #d0d7de;
      --accent: #2563eb;
      --danger: #dc2626;
      --success: #16a34a;
      --input-bg: #ffffff;
    }

    [data-theme="dark"] {
      --bg: #0d1117;
      --card-bg: #161b22;
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --border: #30363d;
      --accent: #3b82f6;
      --danger: #ef4444;
      --success: #22c55e;
      --input-bg: #0d1117;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px);
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    h1 { font-size: 1.5rem; font-weight: 700; }

    .theme-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      font-size: 0.95rem;
    }

    button.primary-btn {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .experiment-item {
      border-left: 4px solid var(--accent);
      margin-bottom: 16px;
    }

    .experiment-item.completed {
      border-left-color: var(--success);
    }

    .exp-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .badge {
      background: var(--border);
      color: var(--text);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge.success {
      background: var(--success);
      color: white;
    }

    .attempts-list {
      list-style: none;
      margin: 12px 0;
      padding-left: 8px;
      border-left: 1px dashed var(--border);
    }

    .attempt-entry {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 0.8rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      cursor: pointer;
    }

    .btn-danger { color: var(--danger); border-color: var(--danger); }
    .btn-success { color: var(--success); border-color: var(--success); }
  </style>
</head>
<body>

  <header>
    <h1>Attempts 🎯</h1>
    <button class="theme-btn" onclick="toggleTheme()">🌓 Theme</button>
  </header>

  <!-- New Experiment Form -->
  <div class="card">
    <div class="form-group">
      <label for="expName">Start New Protocol / Experiment</label>
      <input type="text" id="expName" placeholder="e.g., cccDNA extraction optimization">
    </div>
    <button class="primary-btn" onclick="addExperiment()">Initialize Experiment</button>
  </div>

  <!-- Experiments Dashboard -->
  <div id="experimentsList"></div>

  <script>
    // System Theme Auto-Detection & Persistent Toggle
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    let currentTheme = localStorage.getItem('theme') || (prefersDark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', currentTheme);

    function toggleTheme() {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', currentTheme);
      localStorage.setItem('theme', currentTheme);
    }

    // App State Management via LocalStorage
    let experiments = JSON.parse(localStorage.getItem('attempts_data')) || [];

    function saveData() {
      localStorage.setItem('attempts_data', JSON.stringify(experiments));
      render();
    }

    function addExperiment() {
      const nameInput = document.getElementById('expName');
      if (!nameInput.value.trim()) return;

      const newExp = {
        id: Date.now(),
        name: nameInput.value.trim(),
        status: 'active', // 'active' or 'success'
        attempts: [],
        createdAt: new Date().toLocaleDateString()
      };

      experiments.unshift(newExp);
      nameInput.value = '';
      saveData();
    }

    function logFailure(expId) {
      const reason = prompt("What failed or changed in this try? (e.g., Yield too low, buffer pH off)");
      if (reason === null) return; // User cancelled

      const exp = experiments.find(e => e.id === expId);
      if (exp) {
        exp.attempts.push({
          tryNumber: exp.attempts.length + 1,
          note: reason.trim() || 'Unspecified failure',
          timestamp: new Date().toLocaleDateString()
        });
        saveData();
      }
    }

    function markSuccess(expId) {
      const exp = experiments.find(e => e.id === expId);
      if (exp) {
        exp.status = 'success';
        saveData();
      }
    }

    function deleteExperiment(expId) {
      if (confirm("Delete this experiment log?")) {
        experiments = experiments.filter(e => e.id !== expId);
        saveData();
      }
    }

    function render() {
      const container = document.getElementById('experimentsList');
      container.innerHTML = '';

      if (experiments.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">No attempts logged yet. Start a new experiment above!</p>';
        return;
      }

      experiments.forEach(exp => {
        const isSuccess = exp.status === 'success';
        const totalTries = exp.attempts.length + (isSuccess ? 1 : 0);

        const card = document.createElement('div');
        card.className = `card experiment-item ${isSuccess ? 'completed' : ''}`;
        
        card.innerHTML = `
          <div class="exp-header">
            <strong>${exp.name}</strong>
            <span class="badge ${isSuccess ? 'success' : ''}">
              ${isSuccess ? `Succeeded on Try #${totalTries}` : `${exp.attempts.length} Failures Logged`}
            </span>
          </div>

          <ul class="attempts-list">
            ${exp.attempts.map(att => `
              <li class="attempt-entry">
                <strong>Try #${att.tryNumber}:</strong> ${att.note} <em>(${att.timestamp})</em>
              </li>
            `).join('')}
            ${isSuccess ? `<li class="attempt-entry" style="color: var(--success);"><strong>Try #${totalTries}:</strong> Experiment successful! Target result achieved.</li>` : ''}
          </ul>

          <div class="actions">
            ${!isSuccess ? `
              <button class="btn-sm btn-danger" onclick="logFailure(${exp.id})">+ Log Failed Try</button>
              <button class="btn-sm btn-success" onclick="markSuccess(${exp.id})">Mark Success 🎉</button>
            ` : ''}
            <button class="btn-sm" style="margin-left: auto;" onclick="deleteExperiment(${exp.id})">Delete</button>
          </div>
        `;

        container.appendChild(card);
      });
    }

    // Initial Render
    render();

    // Register Inline Service Worker for Offline Functionality
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }
  </script>
</body>
</html>
